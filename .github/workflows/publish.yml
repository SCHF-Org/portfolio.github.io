name: Publish Teaching Materials

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:

  # ============================================================
  # JOB 1: Build portfolio book and deploy to GitHub Pages
  # quarto render (no profile) → _output/portfolio/
  # ============================================================
  build-and-deploy:
    name: Build Portfolio and Deploy to Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt
        continue-on-error: true

      - name: Render portfolio book
        run: quarto render

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _output/portfolio/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ============================================================
  # JOB 2: Build course websites — manual trigger only
  # quarto render --profile website → _output/website/
  # Archived as a downloadable artifact for now.
  # Uncomment Netlify block to deploy when ready.
  # ============================================================
  build-website:
    name: Build Course Websites
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt
        continue-on-error: true

      - name: Render course websites
        run: quarto render --profile website
        continue-on-error: true

      # -- Netlify deployment (uncomment after adding secrets) --
      # - name: Deploy websites to Netlify
      #   uses: nwtgck/actions-netlify@v3
      #   with:
      #     publish-dir: _output/website
      #     production-branch: main
      #     github-token: ${{ secrets.GITHUB_TOKEN }}
      #     deploy-message: "Deploy course websites from GitHub Actions"
      #   env:
      #     NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      #     NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Archive website build
        uses: actions/upload-artifact@v4
        with:
          name: course-websites
          path: _output/website/
          retention-days: 90

  # ============================================================
  # JOB 3: Build print PDFs — manual trigger only
  # ============================================================
  build-print:
    name: Build Print PDFs
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install TinyTeX
        run: quarto install tinytex

      - name: Render syllabi as PDF
        run: |
          quarto render courses/phil-mind/syllabus.qmd --to pdf
          quarto render courses/phil-intro/syllabus-s1.qmd --to pdf
          quarto render courses/phil-intro/syllabus-s2.qmd --to pdf
          quarto render courses/phil-intro/syllabus-s3.qmd --to pdf
          quarto render courses/phil-logic/syllabus.qmd --to pdf
        continue-on-error: true

      - name: Archive print PDFs
        uses: actions/upload-artifact@v4
        with:
          name: print-syllabi
          path: _output/print/
          retention-days: 90
