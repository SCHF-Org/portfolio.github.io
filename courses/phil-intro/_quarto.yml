# ============================================================
# DEFAULT FORMAT (portfolio HTML)
# Instructor-only content is visible, styled as amber boxes.
# ============================================================

format:
  html:
    theme:
      light:
        - cosmo
        - shared/css/portfolio.scss
    toc: true
    date-format: "MMM DD, YYYY"
    email-obfuscation: javascript
    link-external-newwindow: true
    link-external-icon: true
    html-math-method: katex
    include-in-header:
      text: |
        <script>
          window.MathJax = {
            loader: { load: ['[tex]/bussproofs'] },
            tex: { packages: {'[+]': ['bussproofs']} }
          };
        </script>
        <style>
          .instructor-only {
            background-color: #fff8e1;
            border-left: 4px solid #f59e0b;
            padding: 0.75rem 1rem;
            margin: 1rem 0;
            border-radius: 0 4px 4px 0;
          }
          .instructor-only::before {
            content: "📋 Instructor Note";
            display: block;
            font-weight: bold;
            font-size: 0.85rem;
            color: #92400e;
            margin-bottom: 0.5rem;
          }
        </style>

# ============================================================
# PROFILE: website
# quarto render --profile website
# Builds student-facing course websites.
# Instructor-only content is hidden.
# ============================================================

profiles:
  - name: website
    project:
      type: website
      output-dir: _output/website
    website:
      page-navigation: true
      reader-mode: false
      open-graph: true
      search:
        location: navbar
        type: textbox
      navbar:
        background: primary
      page-footer:
        background: light
        left: "Copyright 2026, Montaque Reynolds"
    format:
      html:
        theme:
          light:
            - journal
            - shared/css/custom.scss
        css:
          - shared/css/custom_style.css
          - shared/css/syllabus.css
        toc: true
        include-in-header:
          - \usepackage{prooftrees}
          text: |
            <style>
              .instructor-only { display: none !important; }
            </style>

# ============================================================
# PROFILE: print
# quarto render courses/phil-mind/syllabus.qmd --profile print --to pdf
# Renders clean PDFs of syllabi for job application packets.
# ============================================================

  - name: print
    project:
      type: default
      output-dir: _output/print
    format:
      pdf:
        documentclass: article
        papersize: letter
        margin-top: 1in
        margin-bottom: 1in
        margin-left: 1in
        margin-right: 1in
        fontsize: 11pt
        linestretch: 1.4
        include-in-header:
          text: |
            \usepackage{fancyhdr}
            \usepackage{comment}
            \pagestyle{fancy}
            \fancyhead[L]{Dr. Montaque Reynolds}
            \fancyhead[R]{Stetson University}
            \fancyfoot[C]{\thepage}
